    <style>
        :root {
            --poster-width: 280px;
            --poster-aspect-ratio: 2 / 3;
            --border-radius: 12px;
            --transition-speed: 0.3s;
            --shadow-normal: 0 8px 20px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 30px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f12;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 30px 15px;
        }

        /* Search Section */
        .search-container {
            max-width: 600px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            color: #ffffff;
            background-color: #1a1a24;
            border: 2px solid #2a2a3a;
            border-radius: 25px;
            outline: none;
            transition: border-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }

        .search-input::placeholder {
            color: #888899;
        }

        .search-input:focus {
            border-color: #e50914;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
        }

        /* Movie Grid Layout */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--poster-width), 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            justify-items: center;
        }

        /* Movie Card Link Wrapper */
        .movie-card {
            position: relative;
            display: block;
            width: 100%;
            max-width: var(--poster-width);
            aspect-ratio: var(--poster-aspect-ratio);
            border-radius: var(--border-radius);
            overflow: hidden;
            text-decoration: none;
            box-shadow: var(--shadow-normal);
            transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }

        .movie-card.hidden {
            display: none;
        }

        .movie-card:hover,
        .movie-card:focus-visible {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
            outline: none;
        }

        /* Poster Image Styling */
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter var(--transition-speed) ease;
        }

        .movie-card:hover img {
            filter: brightness(0.7);
        }

        /* Overlay Text Content */
        .movie-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 15px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0));
            color: #ffffff;
            transform: translateY(100%);
            transition: transform var(--transition-speed) ease;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .movie-card:hover .movie-info,
        .movie-card:focus-visible .movie-info {
            transform: translateY(0);
        }

        .movie-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .movie-badge {
            align-self: flex-start;
            font-size: 0.75rem;
            background-color: #e50914;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>

    <script>
        const searchInput = document.getElementById('searchInput');
        const movieCards = document.querySelectorAll('.movie-card');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();

            movieCards.forEach((card) => {
                const title = card.querySelector('.movie-title').textContent.toLowerCase();
                
                if (title.includes(query)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });
    </script>
