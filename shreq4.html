



<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Դիտել Ֆիլմը - Hayafilm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .video-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Responsive 16:9 Aspect Ratio Container */
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio (720 / 1280 * 100) */
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Navigation / Control Bar */
        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background-color 0.25s ease;
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <main class="video-container">
        <div class="player-wrapper">
            <iframe 
                src="//5808010880810whinehouse.com/cartoons/hls/shrek-yndisht/" 
                allowfullscreen 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
            </iframe>
        </div>

        <nav class="player-controls">
            <a href="javascript:history.back()" class="back-btn">
                &#8592; Վերադառնալ
            </a>
        </nav>
    </main>


</body>
</html>
