<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayafilm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nabla:EDPT,EHLT@200,24&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-red: #e50914;
            --color-blue: #1e3c72;
            --color-orange: #f27121;
            --bg-dark: #0f0f12;
            --card-bg: rgba(255, 255, 255, 0.05);
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        .navbar {
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(12px);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-title {
            font-family: "Nabla", system-ui;
            font-weight: 400;
            font-variation-settings: "EDPT" 200, "EHLT" 24;
            font-size: 2.5rem;
            line-height: 1;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .nav-link:hover,
        .nav-link:focus-visible {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            outline: none;
        }

        /* Card Container */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* Generic Card Styling */
        .card {
            height: 260px;
            border-radius: 24px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px var(--shadow-color);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.35s ease, border-color 0.35s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card p {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
            line-height: 1.3;
        }

        /* Card Hover & Focus States */
        .card:hover,
        .card:focus-visible {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
        }

        /* Card Gradient Themes */
        .card-red {
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.85), rgba(120, 0, 10, 0.95));
        }

        .card-blue {
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.85), rgba(42, 82, 152, 0.95));
        }

        .card-orange {
            background: linear-gradient(135deg, rgba(242, 113, 33, 0.85), rgba(233, 64, 87, 0.95));
        }
    </style>
</head>
<body>

    <header class="navbar">
        <h1 class="brand-title">Hayafilm</h1>
        <a href="https://t.me/+tI3dnLqMrTc5NjRi" class="nav-link" target="_blank" rel="noopener noreferrer">Նորություններ</a>
    </header>

    <main class="card-container">
        <a href="multer.html" class="card card-red">
            <p>Մուլտեր հայերեն թարգմանությամբ</p>
        </a>
        <a href="tarfilm.html" class="card card-blue">
            <p>Ֆիլմեր հայերեն թարգմանությամբ</p>
        </a>
        <a href="hayfilm.html" class="card card-orange">
            <p>Հայկական ֆիլմեր</p>
        </a>
    </main>

</body>
</html>
